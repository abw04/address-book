<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Address Book</title>
  </head>

  <body class="max-3xl m-auto">
    <nav class="p-4 flex bg-blue-200 justify-between items-center">
      <h1 class="text-5xl">Address Book</h1>
      <form class="text-3xl" id="search">
        <input type="search" id="search-bar" class="border p-1" />
        <button
          id="search-button"
          type="submit"
          class="border border-black box-border p-1 rounded text-white bg-blue-800 hover:opacity-70 transition-colors duration-500"
        >
          Search
        </button>
      </form>
    </nav>
    <div class="flex gap-2">
      <form id="contact-form" class="p-2">
        <div class="my-1">
          <label for="full-name" class="block">Full Name</label>
          <input type="text" id="full-name" name="full-name" class="border" />
        </div>
        <div class="my-1">
          <label for="phone" class="block">Phone</label>
          <input type="text" id="phone" name="phone" class="border" />
        </div>
        <div class="my-1">
          <label for="email" class="block">Email</label>
          <input type="text" id="email" name="email" class="border" />
        </div>
        <div class="my-1">
          <label for="location" class="block">Location</label>
          <input type="text" id="location" name="location" class="border" />
        </div>
        <button
          class="mt-2 border border-black box-border p-2 rounded text-white bg-blue-800 hover:opacity-70 transition-colors duration-500"
        >
          Add Contact
        </button>
      </form>

      <div class="border" id="contact"></div>
    </div>
    <script type = "module" src="/main.js"></script>
  </body>
</html>
